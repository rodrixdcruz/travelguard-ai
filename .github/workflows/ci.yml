name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Hermetic suite: the live providers (OSM Overpass, Open-Meteo) honor
      # this kill-switch so tests make zero external HTTP calls — no flaky
      # network timeouts in CI. The demo-fallback path this exercises is
      # itself covered by the tests.
      TRAVELGUARD_DISABLE_LIVE_PROVIDERS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # matches frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # tsc -b && vite build — same command Render runs to deploy, so a
      # type or build failure shows up here first.
      - name: Production build
        run: npm run build
